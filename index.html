<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabian Lehradt</title>
    <link rel="icon" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">

    <meta name="author" content="Fabian Lehradt">
    <meta name="robots" content="index,follow">
    <meta name="url" content="https://fabianlehradt.is-a.dev">
    <meta name="description" content="Social Links">
    <meta name="site_name" content="Fabian Lehradt">
    
    <meta property="og:title" content="Fabian Lehradt">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Social Links">
    <meta property="og:image" content="https://fabianlehradt.is-a.dev/icon.png">
    <link rel="canonical" href="https://fabianlehradt.is-a.dev/">
    <style>
        :root {
            --bg: #333333;
            --bg-dark: #292929;
            --text: #fcfcfc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .icon {
            position: absolute;
            top: 0;
            left: 0;
            width: 5%;
        }
        .profile-image {
            width: 20%;
            height: 20%;
            margin-top: 40px;
            border-radius: 50%;
            border: 7.5px solid var(--bg-dark);
            transition: 0.2s;
        }

        h1 {
            font-size: 50px;
            text-shadow: 4px 2px var(--bg-dark);
        }

        .links {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100vw;
            transition: 0.2s;
        }

        .links a {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 80vw;
            padding: 10px;
            border-radius: 10px;
            font-size: 40px;
            color: var(--text);
            text-decoration: none;
            transition: 0.2s;
        }

        .links a:hover {
            background: var(--bg-dark);
        }

        .links a img {
            width: 40px;
            border: none;
            transition: 0.2s;
        }
        .links a .brand {
            opacity: 0.6;
        }
        .links a .name {
            margin-left: auto;
        }
        @media screen and (width <= 800px) {
            .links a {
                font-size: 30px;
            }
            .links a img {
                width: 30px;
            }
            .profile-image {
                width: 30%;
                height: 30%;
                border: 5px solid var(--bg-dark);
            }
        }
        @media screen and (width <= 615px) {
            .links a {
                font-size: 20px;
            }
            .links a img {
                width: 20px;
            }
            .profile-image {
                width: 40%;
                height: 40%;
                border: 2.5px solid var(--bg-dark);
            }
        }
    </style>
</head>
<body>
    <img class="icon" src="icon.png">
    <img class="profile-image" src="/profile.png">
    <h1>Fabian Lehradt</h1>

    <nav class="links">
        <a href="https://www.instagram.com/fabian_lehradt/" target="_blank">
            <img src="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/instagram/default.svg">
            <span class="brand">Instagram</span>
            <span class="name">fabian_lehradt</span>
        </a>

        <a href="https://discord.com/users/1151971830983311441" target="_blank">
            <img src="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/discord/default.svg">
            <span class="brand">Discord</span>
            <span class="name">cubxbuilder</span>
        </a>

        <a href="https://www.tiktok.com/@fabian_lehradt" target="_blank">
            <img src="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/tiktok/default.svg">
            <span class="brand">TikTok</span>
            <span class="name">fabian_lehradt</span>
        </a>

        <a href="https://github.com/CubxBuilder" target="_blank">
            <img src="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/github/default.svg">
            <span class="brand">GitHub</span>
            <span class="name">CubxBuilder</span>
        </a>

        <a href="https://open.spotify.com/user/31pwbuabdzbqav3fhp6mwyoaanuu?si=4692c7f4d3e24ae5" target="_blank">
            <img src="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/spotify/default.svg">
            <span class="brand">Spotify</span>
            <span class="name">Fabian</span>
        </a>

        <a href="https://www.kleinanzeigen.de/s-bestandsliste.html?userId=163860823" target="_blank">
            <img src="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/kleinanzeigen/default.svg">
            <span class="brand">Kleinanzeigen</span>
            <span class="name">Fabian Lehradt</span>
        </a>
    </nav>
</body>
</html>
